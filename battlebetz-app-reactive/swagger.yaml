openapi: 3.0.0
info:
  title: BattleBetz API
  version: 1.0.0
  description: API for the BattleBetz sports betting platform

servers:
  - url: http://localhost:4000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true

    Bet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
          nullable: true
        tournamentRoundId:
          type: string
          format: uuid
          nullable: true
        risk:
          type: number
          format: float
        odds:
          type: number
          format: float
        potentialPayout:
          type: number
          format: float
        prediction:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, WON, LOST, CANCELLED]
        betTypeId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [UPCOMING, ACTIVE, COMPLETED, CANCELLED]
        prizePool:
          type: number
          format: float
        entryFee:
          type: number
          format: float
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isPublic:
          type: boolean
        maxParticipants:
          type: integer
        roundCount:
          type: integer
        roundType:
          type: string
          enum: [CUMULATIVE, ELIMINATION]

    ApiResponse:
      type: object
      properties:
        data:
          type: object
          nullable: true
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            pageCount:
              type: integer
        error:
          type: string
          nullable: true

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                username:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/login:
    post:
      summary: Login a user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/profile:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    
    patch:
      summary: Update user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                bio:
                  type: string
                avatarUrl:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}:
    get:
      summary: Get a user by ID
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}/bets:
    get:
      summary: Get user's bets
      tags:
        - Users
        - Bets
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, WON, LOST, CANCELLED]
      responses:
        '200':
          description: User's bets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}/tournaments:
    get:
      summary: Get user's tournaments
      tags:
        - Users
        - Tournaments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [UPCOMING, ACTIVE, COMPLETED, CANCELLED]
      responses:
        '200':
          description: User's tournaments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /bets:
    post:
      summary: Create a new bet
      tags:
        - Bets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - risk
                - odds
                - potentialPayout
                - betTypeId
                - selections
              properties:
                risk:
                  type: number
                odds:
                  type: number
                potentialPayout:
                  type: number
                tournamentId:
                  type: string
                  format: uuid
                tournamentRoundId:
                  type: string
                  format: uuid
                betTypeId:
                  type: integer
                prediction:
                  type: string
                selections:
                  type: array
                  items:
                    type: object
                    properties:
                      eventId:
                        type: string
                      type:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      odds:
                        type: number
                      points:
                        type: number
                      sport:
                        type: string
      responses:
        '201':
          description: Bet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid bet data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /bets/recent:
    get:
      summary: Get recent bets
      tags:
        - Bets
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recent bets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /bets/calculate:
    post:
      summary: Calculate potential payout
      tags:
        - Bets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - risk
                - selections
                - betType
              properties:
                risk:
                  type: number
                selections:
                  type: array
                  items:
                    type: object
                    properties:
                      odds:
                        type: number
                betType:
                  type: integer
      responses:
        '200':
          description: Payout calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /bets/{id}:
    get:
      summary: Get a bet by ID
      tags:
        - Bets
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Bet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /bets/{id}/cancel:
    post:
      summary: Cancel a bet
      tags:
        - Bets
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bet cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Cannot cancel bet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments:
    get:
      summary: Get all tournaments
      tags:
        - Tournaments
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [UPCOMING, ACTIVE, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Tournaments found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}:
    get:
      summary: Get a tournament by ID
      tags:
        - Tournaments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Tournament not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}/participants:
    get:
      summary: Get tournament participants
      tags:
        - Tournaments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Tournament participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}/join:
    post:
      summary: Join a tournament
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Joined tournament successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Cannot join tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}/leaderboard:
    get:
      summary: Get tournament leaderboard
      tags:
        - Tournaments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Tournament leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}/rounds:
    get:
      summary: Get tournament rounds
      tags:
        - Tournaments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tournament rounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tournaments/{id}/progress:
    get:
      summary: Get user's progress in tournament
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's tournament progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: User not in tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse' 