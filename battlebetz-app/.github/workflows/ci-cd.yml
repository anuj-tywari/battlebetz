name: CI/CD Pipeline

on:
  push:
    branches:
      - 'main'  
  pull_request:
    branches:
      - 'main'  
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Set Environment Variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_FINIXURL=${{ secrets.EXPO_PUBLIC_FINIXURL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_FINIX_USERNAME=${{ secrets.EXPO_PUBLIC_FINIX_USERNAME }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_FINIX_PASSWORD=${{ secrets.EXPO_PUBLIC_FINIX_PASSWORD }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_FINIX_MERCHANT=${{ secrets.EXPO_PUBLIC_FINIX_MERCHANT }}" >> $GITHUB_ENV
          echo "EXPO_ROUTER_KEY=${{ secrets.EXPO_ROUTER_KEY }}" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV

      - name: Echo env
        run: echo .env


      - name: Build
        run: npm run build:web

      - name: Package the Application
        run: tar -czf ui-build.tar.gz dist

      - name: Upload Package as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui-build.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download the built package
        uses: actions/download-artifact@v4
        with:
          name: ui-build

      - name: Extract package
        run: tar -xzf ui-build.tar.gz

      - name: Add Deployment Server to Known Hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
      
      - name: Deploy Application to Server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "Deploying application...."
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" scp ui-build.tar.gz $SSH_USER@$SSH_HOST:$DEPLOY_PATH
          sshpass -p "$SSH_PASSWORD" ssh $SSH_USER@$SSH_HOST <<EOF
            cd $DEPLOY_PATH
            tar -xzf ui-build.tar.gz
            rm ui-build.tar.gz
          EOF
